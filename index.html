<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو النشر الفاخر | الإصدار الاحترافي</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700&family=Changa:wght@400;600&family=Lateef:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة التصوير -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-gold: #8b6d3b;
            --paper-bg: #fdfbf7; 
            --text-dark: #2c3e50;
            --bg-dark: #0f1216; /* لون خلفية الاستوديو */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #1e242b 0%, #0f1216 100%);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* شريط الأدوات العلوي */
        .toolbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; gap: 8px; margin: 15px auto;
            position: sticky; top: 15px; z-index: 100;
            border-bottom: 3px solid var(--primary-gold);
            flex-wrap: wrap; justify-content: center; align-items: center;
            width: 95%; max-width: 1200px;
            backdrop-filter: blur(10px);
        }

        .tool-btn {
            background: none; border: 1px solid transparent; color: var(--text-dark);
            font-size: 1.1rem; cursor: pointer; width: 36px; height: 36px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .tool-btn:hover { background: #f1f5f9; border-color: var(--primary-gold); color: var(--dark-gold); }
        .highlight-btn { color: #ca8a04; } .highlight-btn:hover { background: #fef08a; border-color: #ca8a04; }

        .divider { width: 1px; background: #cbd5e1; margin: 0 4px; height: 25px; }

        .export-btn {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: white; border: none; padding: 0 20px; height: 38px; border-radius: 6px;
            font-family: 'Tajawal', sans-serif; font-weight: bold; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s;
        }
        .export-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(197, 160, 89, 0.5); }
        
        /* زر المشاركة */
        .share-btn {
            background: linear-gradient(135deg, #0ea5e9, #0369a1); 
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }
        .share-btn:hover { box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); }

        .clear-btn {
            background: transparent; color: #ef4444; border: 1px solid #fca5a5; padding: 0 15px; height: 38px;
            border-radius: 6px; font-family: 'Tajawal', sans-serif; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .clear-btn:hover { background: #fef2f2; }

        .select-styled {
            padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc;
            color: var(--text-dark); font-family: 'Tajawal', sans-serif; font-weight: bold; cursor: pointer; outline: none;
        }
        
        .color-picker-group {
            display: flex; align-items: center; gap: 8px; color: var(--text-dark); font-size: 1.1rem;
            background: rgba(0,0,0,0.04); padding: 5px 10px; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 5px; cursor: pointer; padding: 0; }
        .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker::-webkit-color-swatch { border: none; border-radius: 5px; }

        /* --- نظام الاستوديو (اللوحات الجانبية والورقة) --- */
        .studio-layout {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            gap: 30px;
        }

        /* اللوحات الجانبية للقوالب */
        .sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 90px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(197, 160, 89, 0.5); border-radius: 10px; }

        .category-title {
            color: #cbd5e1; font-family: 'Amiri', serif; font-size: 1.2rem;
            text-align: center; margin-bottom: 10px; border-bottom: 1px dashed rgba(203, 213, 225, 0.3); padding-bottom: 5px;
        }

        /* زر القالب المصغر (Thumbnail) */
        .template-thumb {
            width: 100%; height: 60px; border-radius: 8px; border: 2px solid transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-family: 'Tajawal', sans-serif;
            font-weight: bold; font-size: 0.9rem; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden;

        .template-thumb:hover { transform: scale(1.05); }
        .template-thumb.active { border-color: white; box-shadow: 0 0 15px rgba(197, 160, 89, 0.8); transform: scale(1.05); }

        /* منطقة الورقة الأساسية */
        .main-editor-area {
            flex-grow: 1; display: flex; justify-content: center; min-width: 0;
        }

        .paper-container {
            width: 100%; position: relative; margin-bottom: 60px; padding: 40px; box-sizing: border-box;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--paper-bg);
        }

        /* --- أنماط القوالب المصغرة (Thumbnails) --- */
        .thumb-royal { background: #fdfbf7; color: #8b6d3b; border: 1px solid #c5a059; }
        .thumb-haramain { background: #0b3d2c; color: #d4af37; border: 1px solid #d4af37; }
        .thumb-university { background: #ffffff; color: #166534; border-top: 5px solid #166534; }
        .thumb-personal { background: #0f172a; color: #e2e8f0; border-left: 5px solid #c5a059; }
        .thumb-islamic { background: #ffffff; color: #0F4435; border: 2px solid #0F4435; }
        .thumb-velvet { background: #0a0a0a; color: #facc15; border: 1px solid #a16207; }
        .thumb-vintage { background: #fdf6e3; color: #5d4037; border: 1px solid #795548; }
        .thumb-leather { background: #3e2723; color: #ffb300; border: 1px dashed #a1887f; }
        .thumb-ocean { background: #004d40; color: #80cbc4; border: 2px solid #80cbc4; }
        .thumb-poetry { background: #faf7f2; color: #8b6d3b; border-right: 4px double #8b6d3b; border-left: 4px double #8b6d3b; }
        .thumb-red { background: #881337; color: #fca5a5; border: 2px solid #fca5a5; }

        .thumb-square { background: #1e293b; color: #fbbf24; }
        .thumb-cinematic { background: #000; color: #fff; border: 1px solid #333; }
        .thumb-wisdom { background: #022c22; color: #d4af37; border-radius: 10px; }
        .thumb-alert { background: #ffffff; color: #ef4444; border-right: 4px solid #ef4444; }
        .thumb-news { background: #b91c1c; color: white; border-bottom: 4px solid #000; }
        .thumb-minimal { background: #fff; color: #000; border: 1px solid #e2e8f0; }
        .thumb-greeting { background: #1e1b4b; color: #fde047; border: 1px solid #facc15; }
        .thumb-note { background: #fef08a; color: #b45309; }

        /* --- أنماط الورقة الفعلية (Papers) --- */
        .template-royal { max-width: 794px; min-height: 1123px; color: var(--text-dark); }

        .template-haramain .corner { border-color: #d4af37; border-radius: 50%; width: 30px; height: 30px; }
        .template-haramain .title-divider::before, .template-haramain .title-divider::after { background: #d4af37; } .template-haramain .title-divider i { color: #d4af37; }
        .template-haramain .signature-box, .template-haramain .social-handle { color: #d4af37; } .template-haramain .signature-icon { color: #d4af37; } .template-haramain .document-footer { border-top-color: rgba(212, 175, 55, 0.3); }

        .template-university { max-width: 794px; min-height: 1123px; background-color: #ffffff; color: #1e293b; }

        .template-university .document-body { color: #334155; text-align: justify; } .template-university .ornate-border { border: 2px solid #166534; top: 15px; bottom: 15px; left: 15px; right: 15px; }
        .template-university .ornate-border::before, .template-university .corner, .template-university .title-divider { display: none; }
        .template-university .signature-box, .template-university .social-handle { color: #166534; } .template-university .signature-icon { display: none; } .template-university .document-footer { border-top: 1px solid #cbd5e1; }

        .template-personal { max-width: 794px; min-height: 1123px; background-color: #0f172a; color: #f8fafc; }
        .template-personal .document-title { color: #c5a059; text-align: right; font-family: 'Cairo', sans-serif; } .template-personal .document-body { color: #cbd5e1; }
        .template-personal .ornate-border { border-right: 4px solid #c5a059; border-top: none; border-bottom: none; border-left: none; left: auto; right: 20px; top: 0; bottom: 0; }
        .template-personal .ornate-border::before, .template-personal .corner { display: none; }
        .template-personal .title-divider { justify-content: flex-start; margin-right: 20px; } .template-personal .title-divider::before { display: none; } .template-personal .title-divider::after { width: 200px; background: #c5a059; margin-right: 10px; }
        .template-personal .title-divider i { color: #c5a059; font-size: 1rem; } .template-personal .signature-box, .template-personal .social-handle { color: #94a3b8; } .template-personal .signature-icon { color: #c5a059; } .template-personal .document-footer { border-top: none; }

        .template-islamic { max-width: 794px; min-height: 1123px; background-color: #ffffff; color: #0F4435; }
        .template-islamic .document-title { color: #0F4435; font-family: 'Amiri', serif; }
        .template-islamic .ornate-border { border: 18px solid #0F4435; border-radius: 10px; } .template-islamic .ornate-border::before { border: 2px dashed #C4A265; top: 5px; bottom: 5px; left: 5px; right: 5px; opacity: 1; }

        .template-velvet .ornate-border { border: 2px solid #eab308; box-shadow: inset 0 0 20px rgba(234, 179, 8, 0.2); } .template-velvet .ornate-border::before { border: 1px solid #a16207; margin: 4px; }

        .template-velvet .title-divider i { color: #facc15; text-shadow: 0 0 10px #eab308; } .template-velvet .signature-box, .template-velvet .social-handle { color: #fde047; } .template-velvet .document-footer { border-top-color: rgba(234, 179, 8, 0.3); }

        .template-vintage { max-width: 750px; min-height: 1000px; background-color: #fdf6e3; color: #3e2723; }

        /* الإطار المشترك والعناصر الأساسية للورقة */

        .ornate-border::before { content: ''; position: absolute; top: 6px; bottom: 6px; left: 6px; right: 6px; border: 1px solid var(--dark-gold); opacity: 0.5; transition: all 0.5s ease; }
        .corner { position: absolute; width: 40px; height: 40px; border: 3px solid var(--primary-gold); pointer-events: none; transition: all 0.5s ease; }
        .corner-tl { top: 15px; right: 15px; border-bottom: none; border-left: none; } .corner-tr { top: 15px; left: 15px; border-bottom: none; border-right: none; }
        .corner-bl { bottom: 15px; right: 15px; border-top: none; border-left: none; } .corner-br { bottom: 15px; left: 15px; border-top: none; border-right: none; }

        .content-area { position: relative; z-index: 20; height: 100%; display: flex; flex-direction: column; padding: 20px 30px 45px 30px; /* تمت زيادة المساحة السفلية لرفع التذييل عن الإطار */ }

        /* الشعار (الختم) */
        .author-badge {
            position: absolute; top: 20px; width: 85px; height: 85px; border-radius: 50%;

            display: flex; align-items: center; justify-content: center; z-index: 30; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.5s ease;
        }
        .author-badge::before { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; border: 3px dashed var(--primary-gold); transition: all 0.5s ease; animation: spin-slow 30s linear infinite; }
        .author-badge::after { content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; border-radius: 50%; border: 1px solid var(--primary-gold); opacity: 0.5; transition: all 0.5s ease; }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        .badge-right { right: 25px; } .badge-left { left: 25px; }

        .badge-name1 { font-size: 0.85rem; font-weight: bold; } .badge-divider { width: 35px; height: 1px; background-color: currentColor; margin: 4px 0; opacity: 0.7; } .badge-name2 { font-size: 1.05rem; font-weight: 900; }
        
        /* تلوين الختم للقوالب */

        .template-university .author-badge { background: #fff; border-color: #166534; border-radius: 10px; } .template-university .author-badge::before { display: none; } .template-university .author-badge::after { border-radius: 8px; border-color: #166534; } .template-university .badge-text-content { color: #166534; font-family: 'Tajawal', sans-serif; }
        .template-personal .author-badge { background: #c5a059; border: none; border-radius: 0 0 20px 20px; top: 0; width: 60px; height: 80px; } .template-personal .author-badge::before, .template-personal .author-badge::after { display: none; } .template-personal .badge-text-content { color: #0f172a; } .template-personal .badge-divider { display: none; }
        .template-islamic .author-badge { background: #0F4435; border: 2px solid #C4A265; box-shadow: 0 0 0 4px #0F4435; } .template-islamic .author-badge::before { border: 4px dotted #0F4435; top: -10px; left: -10px; right: -10px; bottom: -10px; animation: none; } .template-islamic .author-badge::after { border-color: #C4A265; } .template-islamic .badge-text-content { color: #C4A265; }
        .template-square .author-badge { background: #0f172a; border-color: #fbbf24; } .template-square .author-badge::before { border-color: #fbbf24; border-style: dotted; } .template-square .badge-text-content { color: #fbbf24; }
        .template-vintage .author-badge { background: #fdf6e3; border-color: #795548; box-shadow: 0 0 0 2px #795548; } .template-vintage .author-badge::before { display: none; } .template-vintage .badge-text-content { color: #5d4037; }
        .template-velvet .author-badge { background: #0a0a0a; border-color: #eab308; } .template-velvet .author-badge::before { border-color: #eab308; } .template-velvet .badge-text-content { color: #fde047; }
        .template-leather .author-badge { background: #3e2723; border-color: #ffb300; } .template-leather .badge-text-content { color: #ffb300; }
        .template-ocean .author-badge { background: #004d40; border-color: #80cbc4; } .template-ocean .badge-text-content { color: #80cbc4; }
        .template-poetry .author-badge { background: #faf7f2; border-color: #8b6d3b; border-radius: 5px; } .template-poetry .author-badge::before{display:none;} .template-poetry .badge-text-content { color: #8b6d3b; }
        .template-red .author-badge { background: #881337; border-color: #fca5a5; } .template-red .badge-text-content { color: #fca5a5; }
        
        /* إخفاء البطاقات */
        .template-card-note .author-badge, .template-card-alert .author-badge, .template-card-wisdom .author-badge, .template-card-cinematic .author-badge, .template-card-news .author-badge, .template-card-minimal .author-badge, .template-card-greeting .author-badge { display: none; }

        [contenteditable="true"] { outline: none; cursor: text; }
        [contenteditable="true"]:empty:before { content: attr(data-placeholder); color: #aaa; font-style: italic; opacity: 0.6; }

        .document-title { font-family: 'Amiri', serif; font-size: 2.5rem; text-align: center; color: var(--dark-gold); margin-top: 30px; margin-bottom: 15px; font-weight: bold; line-height: 1.3; transition: all 0.5s ease; }
        .title-divider { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; opacity: 0.7; }
        .title-divider::before, .title-divider::after { content: ''; height: 2px; width: 100px; background: var(--primary-gold); margin: 0 15px; transition: all 0.5s ease; }
        .title-divider i { color: var(--primary-gold); font-size: 1.5rem; transition: all 0.5s ease; }
        .document-body { font-family: 'Tajawal', sans-serif; font-size: 1.3rem; line-height: 1.8; flex-grow: 1; text-align: justify; color: var(--text-dark); transition: all 0.5s ease; }
        .document-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .document-body ul, .document-body ol { padding-right: 20px; margin-bottom: 15px; }

        /* تعديل التذييل ليكون مرتفعاً لتجنب التداخل مع الإطارات */
        .document-footer { 
            margin-top: auto; 
            margin-bottom: 25px; /* تم الرفع للأعلى بزيادة لضمان عدم ملامسة الإطارات العريضة كالزخرفة الأندلسية */
            display: flex; justify-content: space-between; align-items: center;

            position: relative; z-index: 30; 
        }
        .social-handle { display: flex; align-items: center; gap: 8px; font-family: 'Tajawal', sans-serif; font-size: 1.1rem; color: var(--dark-gold); opacity: 0.8; transition: all 0.5s ease; }
        .social-handle span { border-bottom: 1px solid transparent; } .social-handle span:focus { border-bottom: 1px dashed currentColor; }
        .signature-box { display: flex; align-items: center; gap: 15px; font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--dark-gold); transition: all 0.5s ease; }
        .signature-icon { font-size: 2rem; color: var(--primary-gold); animation: float 3s ease-in-out infinite; transition: all 0.5s ease; }
        .signature-text { min-width: 150px; border-bottom: 1px solid transparent; transition: border 0.3s; text-align: left; }
        .signature-text:focus { border-bottom: 1px dashed var(--primary-gold); }

        .texture-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 0.5s ease; }
        .texture-noise { background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E"); opacity: 1; }
        .texture-islamic { background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%239C92AC' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E"); }
        .texture-dots { background-image: radial-gradient(#000000 1px, transparent 1px); background-size: 20px 20px; opacity: 0.05; }

        #loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 18, 22, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--primary-gold); z-index: 1000; display: none; backdrop-filter: blur(5px); }
        .spinner { font-size: 3.5rem; animation: spin 1s linear infinite; margin-bottom: 20px; }

        /* التجاوب مع الشاشات (الموبايل) */
        @media (max-width: 1050px) {
            .studio-layout { flex-direction: column; align-items: center; gap: 15px; }
            .sidebar { width: 100%; flex-direction: row; position: relative; top: 0; max-height: 80px; overflow-x: auto; overflow-y: hidden; padding-bottom: 10px; }
            .sidebar::-webkit-scrollbar { height: 4px; }
            .template-thumb { min-width: 150px; height: 50px; }
            .category-title { display: none; } 
            .paper-container { transform: scale(0.95); transform-origin: top center; }
        }
        @media (max-width: 600px) {
            .paper-container { transform: scale(0.8); }
            .toolbar { padding: 10px; gap: 5px; }
            .document-footer { flex-direction: column-reverse; gap: 15px; align-items: center; }
            .badge-right, .badge-left { transform: scale(0.7); }
            .badge-right { right: 5px; top: 5px; } .badge-left { left: 5px; top: 5px; }
        }

        /* --- إعدادات الطباعة المخصصة (جديد) --- */
        @media print {
            @page { size: auto; margin: 0mm; }
            body { background: none; background-image: none; }
            #toolbar, .sidebar, #loading-overlay, #imageUpload { display: none !important; }
            .studio-layout { display: block; margin: 0; padding: 0; width: 100%; max-width: none; }
            .main-editor-area { display: block; width: 100%; padding: 0; margin: 0; }
            .paper-container { 
                box-shadow: none !important; margin: 0 auto !important; padding: 40px !important; 
                transform: none !important; width: 100% !important; max-width: 100% !important; min-height: auto !important; 
            }
            /* إخفاء النصوص الإرشادية الباهتة عند الطباعة */
            [contenteditable="true"]:empty:before { content: '' !important; display: none !important; }
            /* إجبار المتصفح على طباعة الألوان والخلفيات بدقة */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        /* كلاس ذكي لإخفاء النصوص الإرشادية الباهتة أثناء حفظ الصورة أو المشاركة */
        body.exporting-mode [contenteditable="true"]:empty:before {
            content: '' !important;
            display: none !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="insertImage(event)">

    <!-- شريط الأدوات العلوي -->
    <div class="toolbar" id="toolbar">
        
        <select class="select-styled" id="categorySwitch" onchange="switchCategory(this.value)" title="تغيير القسم الأساسي" style="background-color: var(--primary-gold); color: white; border-color: var(--dark-gold);">
            <option value="papers">قسم الأوراق والمقالات</option>
            <option value="cards">قسم البطاقات والاقتباسات</option>

        <select class="select-styled" onchange="changeTexture(this.value)" title="أضف ملمساً للورقة" style="width: auto; max-width: 120px;">

            <option value="texture-islamic">زخرفة إسلامية</option>
            <option value="texture-dots">نقاط خفيفة</option>
            <option value="none">بدون ملمس (سادة)</option>
        </select>

        <select class="select-styled" onchange="formatDoc('fontName', this.value)" title="اختر نوع الخط للنص المحدد" style="width: auto; max-width: 120px;">

            <option value="Amiri">أميري (رسمي)</option>

            <option value="'Aref Ruqaa'">الرقعة</option>

        <div class="divider"></div>

        <button class="tool-btn" onclick="formatDoc('italic')" title="خط مائل"><i class="fas fa-italic"></i></button>
        <button class="tool-btn" onclick="formatDoc('underline')" title="خط سفلي"><i class="fas fa-underline"></i></button>
        
        <div class="divider"></div>
        
        <button class="tool-btn" onclick="formatDoc('undo')" title="تراجع"><i class="fas fa-undo"></i></button>

        <button class="tool-btn" onclick="formatDoc('insertUnorderedList')"><i class="fas fa-list-ul"></i></button>
        <button class="tool-btn" onclick="formatDoc('insertOrderedList')"><i class="fas fa-list-ol"></i></button>

        <button class="tool-btn" onclick="formatDoc('justifyRight')"><i class="fas fa-align-right"></i></button>

            <i class="fas fa-font"></i>

        </div>
        <div class="color-picker-group">
            <i class="fas fa-fill-drip"></i>
            <input type="color" class="color-picker" id="bgColor" oninput="changeBgColor(this.value)" value="#f4f5f7">
        </div>
        
        <div class="divider"></div>

        <button class="tool-btn" onclick="window.print()" title="طباعة الورقة المباشرة"><i class="fas fa-print"></i></button>
        
        <button class="clear-btn" onclick="clearDocument()"><i class="fas fa-trash-alt"></i></button>

    <script>
        // مضاعفة عدد القوالب لكل قسم (حوالي 11 ورقة و 8 بطاقات)
        const templatesData = {

                { id: 'template-square', name: 'مربع الاقتباسات', class: 'thumb-square', icon: 'fa-quote-right', side: 'right' },
                { id: 'template-card-wisdom', name: 'بطاقة حكمة', class: 'thumb-wisdom', icon: 'fa-star-and-crescent', side: 'right' },
                { id: 'template-card-news', name: 'خبر عاجل', class: 'thumb-news', icon: 'fa-bolt', side: 'right' },
                { id: 'template-card-greeting', name: 'بطاقة تهنئة', class: 'thumb-greeting', icon: 'fa-moon', side: 'right' },
                { id: 'template-card-cinematic', name: 'البطاقة السينمائية', class: 'thumb-cinematic', icon: 'fa-film', side: 'left' },
                { id: 'template-card-alert', name: 'تنبيه عاجل', class: 'thumb-alert', icon: 'fa-bell', side: 'left' },
                { id: 'template-card-note', name: 'ملاحظة لاصقة', class: 'thumb-note', icon: 'fa-pen-nib', side: 'left' },
                { id: 'template-card-minimal', name: 'اقتباس نقي', class: 'thumb-minimal', icon: 'fa-comment', side: 'left' }
            ]
        };

        function switchCategory(category) {
            const rightSidebar = document.getElementById('sidebar-right');
            const leftSidebar = document.getElementById('sidebar-left');
            
            rightSidebar.innerHTML = `<div class="category-title">النماذج الكلاسيكية</div>`;
            leftSidebar.innerHTML = `<div class="category-title">النماذج الحديثة</div>`;

            templatesData[category].forEach(tpl => {
                const btnHTML = `<div class="template-thumb ${tpl.class}" id="btn-${tpl.id}" onclick="applyTemplate('${tpl.id}', '${tpl.icon}')">
                                    <i class="fas ${tpl.icon}" style="margin-left:8px;"></i> ${tpl.name}
                                 </div>`;
                if(tpl.side === 'right') rightSidebar.innerHTML += btnHTML;
                else leftSidebar.innerHTML += btnHTML;
            });

            const firstTemplate = templatesData[category][0];
            applyTemplate(firstTemplate.id, firstTemplate.icon);
        }

        function applyTemplate(templateId, iconClass) {
            const paper = document.getElementById('paper-capture');
            const dividerIcon = document.getElementById('divider-icon');

            paper.className = 'paper-container';
            paper.classList.add(templateId);
            paper.style.backgroundColor = '';

            if(dividerIcon) dividerIcon.className = 'fas ' + iconClass;

            document.querySelectorAll('.template-thumb').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + templateId);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function formatDoc(cmd, value=null) {
            if (cmd === 'hiliteColor' && !document.queryCommandSupported('hiliteColor')) cmd = 'backColor'; 
            document.execCommand(cmd, false, value);
        }

        let currentSize = 4;
        function changeFontSize(step) {
            currentSize += step;
            if (currentSize < 1) currentSize = 1; if (currentSize > 7) currentSize = 7;
            formatDoc('fontSize', currentSize);
        }

        function insertImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { formatDoc('insertImage', e.target.result); }
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function clearDocument() {
            if(confirm("مسح المحتوى والبدء من جديد؟")) {
                document.getElementById('docTitle').innerHTML = '';
                document.getElementById('docBody').innerHTML = '';
                document.getElementById('docTitle').focus();
            }
        }

        function changeTexture(textureClass) {
            const overlay = document.getElementById('texture-overlay');
            if (textureClass === 'none') { overlay.style.opacity = '0'; } 
            else { overlay.className = 'texture-layer ' + textureClass; overlay.style.opacity = '1'; }
        }

        function changeBgColor(color) {
            document.getElementById('paper-capture').style.backgroundColor = color;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => { console.log(err); });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function exportAsImage() {
            const paper = document.getElementById('paper-capture');
            const overlay = document.getElementById('loading-overlay');
            
            let docTitle = document.getElementById('docTitle').innerText.trim();
            if(!docTitle) docTitle = 'لوحة_احترافية';

            overlay.style.display = 'flex';
            
            // تفعيل الكلاس الذكي لإخفاء النصوص الإرشادية الفارغة قبل التصوير
            document.body.classList.add('exporting-mode');

            document.fonts.ready.then(() => {
                html2canvas(paper, { scale: 2, useCORS: true, backgroundColor: null }).then(canvas => {
                    document.body.classList.remove('exporting-mode'); // إرجاعها بعد التصوير
                    overlay.style.display = 'none';
                    const link = document.createElement('a');
                    link.download = docTitle + '.png'; 
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }).catch(err => {
                    document.body.classList.remove('exporting-mode');
                    overlay.style.display = 'none';
                    alert("حدث خطأ أثناء التصوير.");
                });
            });
        }

        function shareImage() {
            const paper = document.getElementById('paper-capture');
            const overlay = document.getElementById('loading-overlay');
            
            let docTitle = document.getElementById('docTitle').innerText.trim();
            if(!docTitle) docTitle = 'لوحة_احترافية';

            overlay.style.display = 'flex';

            // تفعيل الكلاس الذكي لإخفاء النصوص الإرشادية الفارغة قبل التصوير
            document.body.classList.add('exporting-mode');

            document.fonts.ready.then(() => {
                html2canvas(paper, { scale: 2, useCORS: true, backgroundColor: null }).then(canvas => {
                    document.body.classList.remove('exporting-mode'); // إرجاعها بعد التصوير
                    canvas.toBlob(function(blob) {
                        const file = new File([blob], docTitle + ".png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({ title: docTitle, text: 'تم التصميم عبر استوديو النشر الفاخر', files: [file] })
                            .then(() => { overlay.style.display = 'none'; })
                            .catch((error) => { overlay.style.display = 'none'; console.log('تم إلغاء', error); });
                        } else {
                            overlay.style.display = 'none';
                            alert("متصفحك لا يدعم المشاركة المباشرة، سيتم تحميل الصورة بدلاً من ذلك.");
                            const link = document.createElement('a'); link.download = docTitle + '.png'; link.href = canvas.toDataURL("image/png"); link.click();
                        }
                    }, 'image/png');
                }).catch(err => { 
                    document.body.classList.remove('exporting-mode');
                    overlay.style.display = 'none'; 
                    alert("خطأ."); 
                });
            });
        }

        window.onload = function() { 
            switchCategory('papers'); 
            document.getElementById('docTitle').focus(); 
        };
    </script>
</body>
</html>
